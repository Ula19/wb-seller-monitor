services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wb
      POSTGRES_PASSWORD: wb
      POSTGRES_DB: wb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:  # ротация логов, чтобы не забивали диск
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  bot:
    build: .
    init: true  # tini как PID 1: прибирает зомби-процессы chromium
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
